components:
  securitySchemes:
    scoutSession:
      type: apiKey
      in: cookie
      name: scout_session
  parameters:
    Cursor: { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
    DeviceId: { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
    AlertRuleId: { name: ruleId, in: path, required: true, schema: { type: string, format: uuid } }
    OverrideId: { name: overrideId, in: path, required: true, schema: { type: string, format: uuid } }
    IncidentId: { name: incidentId, in: path, required: true, schema: { type: string, format: uuid } }
    ScanRunId: { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    CandidateId: { name: candidateId, in: path, required: true, schema: { type: string, format: uuid } }
    DestinationId: { name: destinationId, in: path, required: true, schema: { type: string, format: uuid } }
    SuppressionWindowId: { name: windowId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey:
      { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 1, maxLength: 128 } }
  responses:
    BadRequest:
      { description: Invalid request, content: { application/json: { schema: { $ref: "./schemas/error.json" } } } }
    Unauthorized:
      {
        description: Missing or invalid identity,
        content: { application/json: { schema: { $ref: "./schemas/error.json" } } },
      }
    NotFound:
      { description: Resource not found, content: { application/json: { schema: { $ref: "./schemas/error.json" } } } }
    Conflict:
      {
        description: State or revision conflict,
        content: { application/json: { schema: { $ref: "./schemas/error.json" } } },
      }
    Forbidden:
      {
        description: Authenticated owner lacks recent MFA or permission,
        content: { application/json: { schema: { $ref: "./schemas/error.json" } } },
      }
    TooLarge:
      {
        description: Request exceeds bounded size,
        content: { application/json: { schema: { $ref: "./schemas/error.json" } } },
      }
