openapi: 3.1.0
info:
  title: Scout Control API
  version: 1.0.0
  description: Authenticated, owner-scoped control and telemetry API for Scout.
servers:
  - url: /api/v1
security:
  - scoutSession: []
tags:
  - name: authentication
  - name: inventory
  - name: access
  - name: agents
  - name: releases
  - name: operations
  - name: monitoring
  - name: incidents
  - name: notifications
  - name: scanning
paths:
  /setup:
    post:
      tags: [authentication]
      security: []
      description: setupToken and password are writeOnly and are never echoed or logged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./schemas/setup.json" }
      responses:
        "201":
          { description: Owner created, content: { application/json: { schema: { $ref: "./schemas/owner.json" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /sessions:
    post:
      tags: [authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./schemas/session.json" }
      responses:
        "200":
          {
            description: Session created,
            content: { application/json: { schema: { $ref: "./schemas/session.json" } } },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /sessions/current:
    delete:
      tags: [authentication]
      responses:
        "204": { description: Session revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /sessions/reauth:
    post:
      tags: [authentication]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "./schemas/reauth.json" } } }
      responses:
        "204": { description: Recent verification updated }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /owner:
    get:
      tags: [authentication]
      responses:
        "200":
          {
            description: Safe owner metadata,
            content: { application/json: { schema: { $ref: "./schemas/owner.json" } } },
          }
  /owner/mfa/setup:
    post:
      tags: [authentication]
      responses:
        "200": { description: One-time enrollment material }
  /owner/mfa/confirm:
    post:
      tags: [authentication]
      responses:
        "200": { description: Recovery codes returned once }
  /owner/recovery-codes:
    post:
      tags: [authentication]
      responses:
        "200": { description: Recovery codes returned once }
  /devices:
    get:
      tags: [inventory]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: query, in: query, schema: { type: string, maxLength: 128 } }
        - { name: health, in: query, schema: { type: string } }
        - { name: monitoringState, in: query, schema: { type: string } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          {
            description: Device summaries,
            content: { application/json: { schema: { $ref: "./schemas/device-list.json" } } },
          }
  /devices/{deviceId}:
    parameters:
      - { $ref: "#/components/parameters/DeviceId" }
    get:
      tags: [inventory]
      responses:
        "200":
          { description: Device detail, content: { application/json: { schema: { $ref: "./schemas/device.json" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /devices/{deviceId}/metrics:
    parameters:
      - { $ref: "#/components/parameters/DeviceId" }
    get:
      tags: [inventory]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: metric, in: query, schema: { type: string, maxLength: 128 } }
        - { name: entityId, in: query, schema: { type: string, maxLength: 128 } }
        - { name: maxPoints, in: query, schema: { type: integer, minimum: 2, maximum: 600, default: 600 } }
        - name: seriesId
          in: query
          description: Repeat this parameter to request up to 16 explicit series.
          style: form
          explode: true
          schema: { type: array, maxItems: 16, items: { type: string, format: uuid } }
      responses:
        "200":
          {
            description: Historical metric series,
            content: { application/json: { schema: { $ref: "./schemas/metrics.json" } } },
          }
  /topology:
    get:
      tags: [inventory]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Evidence-backed topology }
  /observations/{observationId}:
    get:
      tags: [inventory]
      parameters:
        - { name: observationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Redacted observation metadata }
  /sites:
    get: { tags: [access], responses: { "200": { description: Sites } } }
    post:
      tags: [access]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "./schemas/site.json" } } } }
      responses: { "201": { description: Site created } }
  /scopes:
    get: { tags: [access], responses: { "200": { description: Scopes } } }
    post:
      tags: [access]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "./schemas/scope.json" } } } }
      responses: { "201": { description: Scope created } }
  /scopes/{scopeId}:
    patch:
      tags: [access]
      parameters: [{ name: scopeId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "./schemas/scope-patch.json" } } } }
      responses: { "200": { description: Scope updated }, "409": { $ref: "#/components/responses/Conflict" } }
    get:
      tags: [access]
      parameters: [{ name: scopeId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Scope detail including the redacted scan policy } }
  /scopes/{scopeId}/scan-runs:
    post:
      tags: [scanning]
      x-requires-recent-mfa: true
      parameters:
        - { name: scopeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "./schemas/scan-run-create.json" } } }
      responses:
        "202":
          {
            description: Owner-triggered scan queued,
            content: { application/json: { schema: { $ref: "./schemas/scan-run.json" } } },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /scopes/{scopeId}/scan-status:
    get:
      tags: [scanning]
      parameters: [{ name: scopeId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          {
            description: Scope scan status and bounded coverage,
            content: { application/json: { schema: { $ref: "./schemas/scan-status.json" } } },
          }
        "404": { $ref: "#/components/responses/NotFound" }
  /scan-runs:
    get:
      tags: [scanning]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: scopeId, in: query, schema: { type: string, format: uuid } }
        - { name: scannerId, in: query, schema: { type: string, maxLength: 128 } }
        - { name: state, in: query, schema: { $ref: "./schemas/scan-common.json#/$defs/runState" } }
        - { name: startedAfter, in: query, schema: { type: string, format: date-time } }
        - { name: startedBefore, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          {
            description: Redacted scan run summaries,
            content: { application/json: { schema: { $ref: "./schemas/scan-run-list.json" } } },
          }
  /scan-runs/{runId}:
    get:
      tags: [scanning]
      parameters: [{ $ref: "#/components/parameters/ScanRunId" }]
      responses:
        "200":
          {
            description: Scan run detail,
            content: { application/json: { schema: { $ref: "./schemas/scan-run.json" } } },
          }
        "404": { $ref: "#/components/responses/NotFound" }
  /scan-runs/{runId}/cancel:
    post:
      tags: [scanning]
      parameters: [{ $ref: "#/components/parameters/ScanRunId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "./schemas/scan-run-cancel.json" } } }
      responses:
        "202":
          {
            description: Scan cancellation accepted,
            content: { application/json: { schema: { $ref: "./schemas/scan-run.json" } } },
          }
        "409": { $ref: "#/components/responses/Conflict" }
  /candidates:
    get:
      tags: [scanning]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: scopeId, in: query, schema: { type: string, format: uuid } }
        - { name: state, in: query, schema: { $ref: "./schemas/scan-common.json#/$defs/candidateState" } }
        - { name: accessMethod, in: query, schema: { type: string, enum: [ssh] } }
        - { name: freshness, in: query, schema: { $ref: "./schemas/scan-common.json#/$defs/coverageState" } }
        - { name: query, in: query, schema: { type: string, maxLength: 128 } }
      responses:
        "200":
          {
            description: Actionable candidate summaries,
            content: { application/json: { schema: { $ref: "./schemas/candidate-list.json" } } },
          }
  /candidates/{candidateId}:
    get:
      tags: [scanning]
      parameters: [{ $ref: "#/components/parameters/CandidateId" }]
      responses:
        "200":
          {
            description: Candidate evidence and access state,
            content: { application/json: { schema: { $ref: "./schemas/candidate-detail.json" } } },
          }
        "404": { $ref: "#/components/responses/NotFound" }
  /candidates/{candidateId}/entry-points:
    get:
      tags: [scanning]
      parameters:
        - { $ref: "#/components/parameters/CandidateId" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: currentOnly, in: query, schema: { type: boolean } }
        - { name: scannerId, in: query, schema: { type: string, maxLength: 128 } }
      responses:
        "200":
          {
            description: Redacted entry-point observations,
            content: { application/json: { schema: { $ref: "./schemas/entry-point-observation-list.json" } } },
          }
  /candidates/{candidateId}/reevaluate:
    post:
      tags: [scanning]
      parameters: [{ $ref: "#/components/parameters/CandidateId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "./schemas/candidate-reevaluate.json" } } }
      responses:
        "202": { description: Candidate re-evaluation queued }
        "409": { $ref: "#/components/responses/Conflict" }
  /credentials:
    get: { tags: [access], responses: { "200": { description: Credential metadata only } } }
    post:
      tags: [access]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "./schemas/credential.json" } } } }
      responses: { "201": { description: Credential reference created } }
  /credentials/{credentialId}:
    delete:
      tags: [access]
      parameters: [{ name: credentialId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "204": { description: Credential revoked } }
  /trust:
    get: { tags: [access], responses: { "200": { description: Trust records } } }
    post:
      tags: [access]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "./schemas/trust.json" } } } }
      responses: { "201": { description: Trust record created } }
  /access-requests:
    get: { tags: [access], responses: { "200": { description: Actionable unmet prerequisites } } }
  /jobs:
    get: { tags: [access], responses: { "200": { description: Redacted job progress } } }
  /bootstrap-invitations:
    post:
      tags: [agents]
      requestBody:
        { required: true, content: { application/json: { schema: { $ref: "./schemas/bootstrap-invitation.json" } } } }
      responses: { "201": { description: Single-use invitation returned once } }
  /devices/{deviceId}/bootstrap:
    post:
      tags: [agents]
      parameters: [{ $ref: "#/components/parameters/DeviceId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "./schemas/revision.json" } } } }
      responses: { "200": { description: Device-bound invitation returned once } }
  /bootstrap/agent/{architecture}:
    get:
      tags: [agents]
      security: []
      description: Public bootstrap binary for a supported Linux architecture. The response checksum checks transport integrity, not release trust.
      parameters:
        - name: architecture
          in: path
          required: true
          schema: { type: string, enum: [amd64, arm64] }
      responses:
        "200":
          description: Linux agent bootstrap binary
          headers:
            X-Scout-Agent-SHA256: { schema: { type: string, pattern: "^[A-Fa-f0-9]{64}$" } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }
  /bootstrap/agent/install.sh:
    get:
      tags: [agents]
      security: []
      description: Public self-hosted installer script for the server bootstrap endpoint.
      responses:
        "200":
          description: Installer script
          content: { text/plain: { schema: { type: string } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /devices/{deviceId}/decommission:
    post:
      tags: [operations]
      parameters: [{ $ref: "#/components/parameters/DeviceId" }]
      requestBody:
        { required: true, content: { application/json: { schema: { $ref: "./schemas/decommission.json" } } } }
      responses: { "202": { description: Revocation accepted } }
  /devices/{deviceId}/reenable:
    post:
      tags: [operations]
      parameters: [{ $ref: "#/components/parameters/DeviceId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "./schemas/revision.json" } } } }
      responses: { "200": { description: Device re-enabled } }
  /control/pause:
    post:
      tags: [operations]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "./schemas/pause.json" } } } }
      responses: { "200": { description: Requested/effective pause state } }
  /control/state:
    get: { tags: [operations], responses: { "200": { description: Control state } } }
  /agent/v1/enroll:
    post:
      tags: [agents]
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "./schemas/enroll.json" } } } }
      responses: { "200": { description: Issued device identity and certificate } }
  /agent/v1/renew:
    post:
      tags: [agents]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "./schemas/renew.json" } } } }
      responses: { "200": { description: Renewed certificate } }
  /agent/v1/batches:
    post:
      tags: [agents]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "./schemas/batch.json" } } } }
      responses:
        {
          "200": { description: Batch acknowledgement },
          "409": { $ref: "#/components/responses/Conflict" },
          "413": { $ref: "#/components/responses/TooLarge" },
        }
  /agent/v1/heartbeat:
    post:
      tags: [agents]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "./schemas/heartbeat.json" } } } }
      responses: { "200": { description: Current server policy revision } }
  /agent/v1/desired-state:
    get: { tags: [agents], responses: { "200": { description: Bounded desired state } } }
  /agent/v1/scan-results:
    post:
      tags: [agents]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "./schemas/scan-result-page.json" } } }
      responses:
        "200":
          {
            description: Accepted or duplicate scan-result page,
            content: { application/json: { schema: { $ref: "./schemas/scan-result-response.json" } } },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { description: Scan backpressure, headers: { Retry-After: { schema: { type: integer, minimum: 1 } } } }
  /worker/v1/claim:
    post: { tags: [agents], responses: { "200": { description: Target-scoped job claim } } }
  /releases/import:
    post:
      {
        tags: [releases],
        requestBody:
          { required: true, content: { application/json: { schema: { $ref: "./schemas/release-bundle.json" } } } },
        responses: { "201": { description: Verified release } },
      }
  /releases:
    get: { tags: [releases], responses: { "200": { description: Immutable release metadata } } }
  /rollouts:
    get: { tags: [releases], responses: { "200": { description: Rollouts } } }
    post: { tags: [releases], responses: { "202": { description: Desired assignments created } } }
  /audit:
    get: { tags: [operations], responses: { "200": { description: Redacted audit events } } }
  /recovery/reconcile:
    post: { tags: [operations], responses: { "200": { description: Recovery mode cleared } } }
  /alert-rules:
    get:
      tags: [incidents]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: enabled, in: query, schema: { type: boolean } }
        - { name: targetKind, in: query, schema: { type: string, enum: [fleet, site, device] } }
        - { name: targetId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          {
            description: Alert rules,
            content: { application/json: { schema: { $ref: "./schemas/alert-rule-list.json" } } },
          }
    post:
      tags: [incidents]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        { required: true, content: { application/json: { schema: { $ref: "./schemas/alert-rule-input.json" } } } }
      responses:
        "201":
          {
            description: Alert rule created,
            content: { application/json: { schema: { $ref: "./schemas/alert-rule.json" } } },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /alert-rules/{ruleId}:
    parameters: [{ $ref: "#/components/parameters/AlertRuleId" }]
    get:
      tags: [incidents]
      responses:
        "200":
          { description: Alert rule, content: { application/json: { schema: { $ref: "./schemas/alert-rule.json" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [incidents]
      requestBody:
        { required: true, content: { application/json: { schema: { $ref: "./schemas/alert-rule-patch.json" } } } }
      responses:
        "200":
          {
            description: Alert rule revised,
            content: { application/json: { schema: { $ref: "./schemas/alert-rule.json" } } },
          }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [incidents]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "./schemas/revision.json" } } } }
      responses:
        "204": { description: Alert rule retired }
        "409": { $ref: "#/components/responses/Conflict" }
  /alert-rules/{ruleId}/overrides:
    parameters: [{ $ref: "#/components/parameters/AlertRuleId" }]
    get:
      tags: [incidents]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          {
            description: Rule overrides,
            content: { application/json: { schema: { $ref: "./schemas/alert-rule-override-list.json" } } },
          }
    post:
      tags: [incidents]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: "./schemas/alert-rule-override-input.json" } } },
        }
      responses:
        "201":
          {
            description: Rule override created,
            content: { application/json: { schema: { $ref: "./schemas/alert-rule-override.json" } } },
          }
        "409": { $ref: "#/components/responses/Conflict" }
  /alert-rules/{ruleId}/overrides/{overrideId}:
    parameters:
      - { $ref: "#/components/parameters/AlertRuleId" }
      - { $ref: "#/components/parameters/OverrideId" }
    patch:
      tags: [incidents]
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: "./schemas/alert-rule-override-patch.json" } } },
        }
      responses:
        "200":
          {
            description: Rule override revised,
            content: { application/json: { schema: { $ref: "./schemas/alert-rule-override.json" } } },
          }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [incidents]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "./schemas/revision.json" } } } }
      responses:
        "204": { description: Rule override retired }
        "409": { $ref: "#/components/responses/Conflict" }
  /incidents:
    get:
      tags: [incidents]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: status, in: query, schema: { type: string, enum: [active, resolved, closed] } }
        - { name: acknowledged, in: query, schema: { type: boolean } }
        - { name: severity, in: query, schema: { type: string, enum: [warning, critical] } }
        - { name: deviceId, in: query, schema: { type: string, format: uuid } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          {
            description: Incident summaries,
            content: { application/json: { schema: { $ref: "./schemas/incident-list.json" } } },
          }
  /incidents/{incidentId}:
    parameters: [{ $ref: "#/components/parameters/IncidentId" }]
    get:
      tags: [incidents]
      responses:
        "200":
          {
            description: Incident episode,
            content: { application/json: { schema: { $ref: "./schemas/incident.json" } } },
          }
        "404": { $ref: "#/components/responses/NotFound" }
  /incidents/{incidentId}/transitions:
    parameters: [{ $ref: "#/components/parameters/IncidentId" }]
    get:
      tags: [incidents]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          {
            description: Incident transitions,
            content: { application/json: { schema: { $ref: "./schemas/incident-transition-list.json" } } },
          }
  /incidents/{incidentId}/acknowledgment:
    parameters: [{ $ref: "#/components/parameters/IncidentId" }]
    post:
      tags: [incidents]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: "./schemas/incident-acknowledgment.json" } } },
        }
      responses:
        "200":
          {
            description: Acknowledged incident,
            content: { application/json: { schema: { $ref: "./schemas/incident.json" } } },
          }
        "409": { $ref: "#/components/responses/Conflict" }
  /notification-destinations:
    get:
      tags: [notifications]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          {
            description: Redacted ntfy destinations,
            content: { application/json: { schema: { $ref: "./schemas/notification-destination-list.json" } } },
          }
    post:
      tags: [notifications]
      x-requires-recent-mfa: true
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
