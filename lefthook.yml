pre-commit:
  parallel: true
  commands:
    format:
      run: npm run format:check
    lint:
      run: npm run lint
    unit:
      run: npm test -- --run
    rust:
      run: cargo fmt --all -- --check && cargo clippy --workspace --all-targets -- -D warnings
pre-push:
  commands:
    quality:
      run: npm run typecheck && cargo test --workspace && npm test -- --run && npm run build
