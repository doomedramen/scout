min_version: 2.1.12

pre-commit:
  parallel: false
  jobs:
    - name: format staged files
      run: bash scripts/format-staged.sh
      fail_text: Staged source files are not formatted; the formatter was unable to complete.
    - name: lint and typecheck
      run: npm run lint
    - name: staged diff check
      run: git diff --cached --check

pre-push:
  parallel: false
  jobs:
    - name: quality checks
      run: npm run lint && npm test && npm run build
    - name: browser checks
      run: npm run test:e2e:browser
