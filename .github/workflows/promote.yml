name: promote

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "40-character commit SHA of the tested sha-* image"
        required: true
        type: string
      version:
        description: "Stable image tag, for example 1.0.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/doomedramen/scout

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Validate deployment definition
        run: docker compose -f compose.yaml config >/dev/null
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Promote the exact tested digest
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          case "$SOURCE_SHA" in
            ????????????????????????????????????????)
              case "$SOURCE_SHA" in
                *[!0-9a-fA-F]*) echo "source_sha must be a 40-character commit SHA" >&2; exit 1 ;;
              esac
              ;;
            *) echo "source_sha must be a 40-character commit SHA" >&2; exit 1 ;;
          esac
          case "$VERSION" in
            ""|*[!0-9A-Za-z._-]*) echo "version contains unsupported characters" >&2; exit 1 ;;
          esac
          source="$IMAGE:sha-$SOURCE_SHA"
          digest=$(docker buildx imagetools inspect "$source" --format '{{.Manifest.Digest}}')
          test -n "$digest"
          immutable="$IMAGE@$digest"
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$immutable"
          docker buildx imagetools create --tag "$IMAGE:latest" "$immutable"
