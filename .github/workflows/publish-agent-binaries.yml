name: Publish agent binaries

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        architecture: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - name: Build Linux agent
        env:
          GOARCH: ${{ matrix.architecture }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build -trimpath -ldflags='-s -w' -o "dist/scout-agent-linux-$GOARCH" ./apps/agent
          sha256sum "dist/scout-agent-linux-$GOARCH" > "dist/scout-agent-linux-$GOARCH.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: scout-agent-${{ matrix.architecture }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: scout-agent-*
          path: release
          merge-multiple: true
      - name: Create release assets
        run: |
          cd release
          sha256sum scout-agent-linux-amd64 scout-agent-linux-arm64 > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
