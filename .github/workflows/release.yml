name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/doomedramen/scout

jobs:
  release_config:
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        name: Check for the release signing key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.SCOUT_RELEASE_SIGNING_KEY }}
        run: |
          set -eu
          if [ -n "$RELEASE_SIGNING_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signed release publishing is disabled until SCOUT_RELEASE_SIGNING_KEY is configured."
          fi

  agent:
    needs: release_config
    if: needs.release_config.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux
            architecture: x86_64
            artifact: scout-agent-linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux
            architecture: aarch64
            artifact: scout-agent-linux-aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
            architecture: x86_64
            artifact: scout-agent-macos-x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos
            architecture: aarch64
            artifact: scout-agent-macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.96.0
          target: ${{ matrix.target }}
      - name: Install Linux linker
        if: startsWith(matrix.target, 'aarch64-unknown-linux-musl') || startsWith(matrix.target, 'x86_64-unknown-linux-musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build native agent
        run: |
          set -eu
          cargo build --release --locked --manifest-path agent/Cargo.toml --target "${{ matrix.target }}"
          mkdir -p agent-artifacts
          cp "target/${{ matrix.target }}/release/scout-agent" "agent-artifacts/${{ matrix.artifact }}"
          chmod 0755 "agent-artifacts/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.platform }}-${{ matrix.architecture }}
          path: agent-artifacts/${{ matrix.artifact }}
          if-no-files-found: error

  image:
    needs: [release_config, agent]
    if: needs.release_config.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: agent-artifacts
          pattern: agent-*
          merge-multiple: true
      - name: Create and verify signed release manifest
        env:
          SCOUT_RELEASE_SIGNING_KEY: ${{ secrets.SCOUT_RELEASE_SIGNING_KEY }}
          SCOUT_RELEASE_SEQUENCE: ${{ github.run_number }}
          SCOUT_AGENT_VERSION: 0.0.0-${{ github.sha }}
        run: |
          set -eu
          : "${SCOUT_RELEASE_SIGNING_KEY:?SCOUT_RELEASE_SIGNING_KEY must be configured for release builds}"
          for target in \
            linux/x86_64 \
            linux/aarch64 \
            macos/x86_64 \
            macos/aarch64; do
            platform=${target%/*}
            architecture=${target#*/}
            SCOUT_AGENT_ARTIFACT_DIR=agent-artifacts \
            SCOUT_AGENT_PLATFORM="$platform" \
            SCOUT_AGENT_ARCHITECTURE="$architecture" \
              node scripts/create-release-manifest.mjs
          done
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync("agent-artifacts/release-manifest.json", "utf8"));
          const targets = new Set(manifest.artifacts.map((artifact) => `${artifact.platform}/${artifact.architecture}`));
          if (targets.size !== 4 || !["linux/x86_64", "linux/aarch64", "macos/x86_64", "macos/aarch64"].every((target) => targets.has(target))) {
            throw new Error("release manifest does not contain all four native agents");
          }
          NODE
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=prerelease-${{ github.run_number }},enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/containers/server.Dockerfile
          push: true
          platforms: linux/amd64
          build-args: SCOUT_USE_PREBUILT_ARTIFACTS=1
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
