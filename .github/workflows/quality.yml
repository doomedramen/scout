name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Install static-analysis tools
        env:
          GOBIN: ${{ runner.temp }}/scout-tools
        run: |
          set -eu
          mkdir -p "$GOBIN"
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.12.0
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            | tar -xz -C "$GOBIN" actionlint
          curl -fsSL https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64 \
            -o "$GOBIN/hadolint"
          chmod 0755 "$GOBIN/actionlint" "$GOBIN/hadolint"
      - name: Check shell scripts
        env:
          TOOL_BIN: ${{ runner.temp }}/scout-tools
        run: |
          set -eu
          shellcheck scripts/*.sh packaging/host/scout
          "$TOOL_BIN/shfmt" -d -i 2 -ci scripts/*.sh packaging/host/scout
      - name: Check workflows
        run: ${{ runner.temp }}/scout-tools/actionlint .github/workflows/*.yml
      - name: Check container files
        run: ${{ runner.temp }}/scout-tools/hadolint packaging/containers/server.Dockerfile

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  rust:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.96.0
          target: ${{ matrix.target }}
          components: rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
