name: scout
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: scout
      POSTGRES_DB: scout
      POSTGRES_PASSWORD: ${SCOUT_DB_PASSWORD:?Set SCOUT_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - scout-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  server:
    profiles: ["production"]
    image: ${SCOUT_IMAGE:-ghcr.io/doomedramen/scout:latest}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SCOUT_PRODUCTION: "true"
      SCOUT_LISTEN: "0.0.0.0:8443"
      SCOUT_DATABASE_URL: postgres://scout:${SCOUT_DB_PASSWORD}@postgres:5432/scout?sslmode=disable
      SCOUT_SETUP_TOKEN_FILE: /etc/scout/secrets/setup-token
      SCOUT_SECRET_KEY_FILE: /etc/scout/secrets/wrapping-key
      SCOUT_TLS_CERT_FILE: /etc/scout/tls/server.crt
      SCOUT_TLS_KEY_FILE: /etc/scout/tls/server.key
      SCOUT_AGENT_CA_FILE: /etc/scout/tls/agent-ca.pem
      SCOUT_AGENT_CA_KEY_FILE: /etc/scout/tls/agent-ca-key.pem
      SCOUT_RELEASE_TRUST_FILE: /etc/scout/secrets/release-trust.txt
      SCOUT_ARTIFACT_DIR: /var/lib/scout/releases
      SCOUT_REQUIRE_AGENT_MTLS: "true"
      SCOUT_ALLOWED_ORIGIN: ${SCOUT_ALLOWED_ORIGIN:?Set SCOUT_ALLOWED_ORIGIN for the production profile}
      SCOUT_PUBLIC_ORIGIN: ${SCOUT_PUBLIC_ORIGIN:?Set SCOUT_PUBLIC_ORIGIN to the HTTPS URL reachable by target Linux hosts}
      SCOUT_AUTO_ENROLLMENT: ${SCOUT_AUTO_ENROLLMENT:-true}
    ports:
      - "${SCOUT_BIND_ADDRESS:-127.0.0.1}:${SCOUT_PORT:-8443}:8443"
    volumes:
      - scout-server-data:/var/lib/scout
      - scout-secrets:/etc/scout/secrets:ro
      - scout-tls:/etc/scout/tls:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  scout-postgres:
  scout-server-data:
  scout-secrets:
  scout-tls:
