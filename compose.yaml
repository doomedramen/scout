name: scout

services:
  scout:
    image: ${SCOUT_IMAGE:-ghcr.io/doomedramen/scout:edge}
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: ${SCOUT_PORT:-8080}
      SCOUT_PORT: ${SCOUT_PORT:-8080}
      SCOUT_PUBLIC_URL: ${SCOUT_PUBLIC_URL:-}
      SCOUT_DATA_DIR: /data
      SCOUT_RELEASE_CHANNEL: ${SCOUT_RELEASE_CHANNEL:-stable}
    volumes:
      - scout-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 8080) + '/api/health/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  scout-data:
